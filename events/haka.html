<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haka Competition</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="https://esm.run/@material/web/all.js?module"></script>
</head>
<body>
    <div id="header"></div>

    <main>
        <div class="hero">
            <h1 class="md-display-large">Haka Competition</h1>
        </div>

        <div class="content grid-container">
            <md-filled-card class="grid-item">
                <h2 class="md-title-large">Event Details</h2>
                <p class="md-body-large">This is a house event. All students are in their house groups and in house uniform for the day. This is a great day of competition and house spirit. Each house performs the school haka.</p>
            </md-filled-card>
            <md-filled-card class="grid-item">
                <h2 class="md-title-large">Results</h2>
                <p class="md-body-large">1st: Champagnat</p>
                <p class="md-body-large">2nd: Barbier</p>
                <p class="md-body-large">3rd: Colin</p>
                <p class="md-body-large">4th: McAuley</p>
            </md-filled-card>
        </div>
    </main>

    <div id="footer"></div>
    <script>const page_level = 1;</script>
    <script src="../main.js" defer></script>
</body>
</html>
